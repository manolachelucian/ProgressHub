services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    develop:
      watch:
        
        - action: sync
          path: ./ProgressHub.Web/wwwroot
          target: /app/wwwroot

        
        - action: rebuild
          path: .